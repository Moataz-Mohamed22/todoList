<div>
  <h1 class="text-center text-primary">
    {{ title }}
  </h1>

  <img
    [src]="imageLink"
    width="300"
    height="200"
    class="img-fluid mx-auto d-block mb-3"
  />

  <div class="container">

    <!-- Add / Edit Task -->
    <div class="row">

      <div class="col-sm-10">
        <input
          class="form-control mb-4"
          [(ngModel)]="newTask"
          placeholder="New Task"
          type="text"
        />
      </div>

      <div class="col-sm-2">
        <button
          class="btn btn-success"
          (click)="addTask()"
        >
          {{ editIndex === -1 ? 'Add Task' : 'Update Task' }}
        </button>
      </div>

    </div>

    <!-- Tasks -->
    <div class="row">

      <div class="col-sm-10">

        @if (isAvailable) {

          <table class="table table-striped table-dark">

            <thead>
              <tr>
                <th>Item</th>
                <th>Edit</th>
                <th>Remove</th>
              </tr>
            </thead>

            <tbody>

              @for (task of tasks; track $index) {

                <tr>

                  <td>
                    {{ task }}
                  </td>

                  <td>
                    <button
                      (click)="EditTask($index)"
                      class="btn btn-warning"
                    >
                      Edit
                    </button>
                  </td>

                  <td>
                    <button
                      (click)="RemoveTask($index)"
                      class="btn btn-danger"
                    >
                      Remove
                    </button>
                  </td>

                </tr>

              }

            </tbody>

          </table>

        }

      </div>

    </div>

  </div>
</div>
